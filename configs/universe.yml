pairs:
  - name: oil_energy
    y: ENERGY_EQ
    x: WTI
    asset_classes: [equity, commodity]
    thesis: Energy equities and crude oil share a common cash-flow driver, but adjust at different speeds.
  - name: copper_miners
    y: MINERS
    x: COPPER
    asset_classes: [equity, commodity]
    thesis: Miners embed operating leverage to copper and can temporarily diverge from the metal.
  - name: gold_tips
    y: GOLD
    x: TIPS
    asset_classes: [commodity, rates]
    thesis: Gold and inflation-protected bonds share sensitivity to real rates and inflation risk.
  - name: credit_equity
    y: HY_CREDIT
    x: EQUITY
    asset_classes: [credit, equity]
    thesis: High-yield credit and equities are two claims on the same corporate balance sheets.
  - name: banks_curve
    y: BANKS
    x: CURVE_PROXY
    asset_classes: [equity, rates]
    thesis: Bank earnings sensitivity links sector valuations to the shape of the yield curve.
