annualization: 252
fdr_alpha: 0.10

# Public observed FRED levels used as a reproducible cross-asset stress study.
# Some inputs are yields, spreads, indices, or reference levels rather than
# executable total-return instruments. Do not interpret results as a live strategy.
strategy:
  hedge_model: kalman
  rolling_ols_lookback: 126
  zscore_lookback: 60
  entry_z: 2.0
  exit_z: 0.5
  stop_z: 4.0
  kalman_delta: 0.000001
  observation_variance: 0.001
  cost_bps: 0.0
  commission_bps: 0.5
  half_spread_bps: 1.0
  slippage_bps: 0.5
  impact_coefficient_bps: 0.25
  borrow_rate_bps_annual: 50.0
  financing_rate_bps_annual: 100.0
  target_volatility: 0.08
  volatility_lookback: 42
  max_leverage: 1.5

walk_forward:
  train_size: 504
  test_size: 126
  purge_size: 5
  zscore_lookbacks: [40, 60]
  entry_thresholds: [1.0, 1.5]

portfolio:
  volatility_lookback: 63
  correlation_lookback: 126
  correlation_penalty: 1.25
  rebalance_frequency: 21
  max_weight: 0.25
  allocation_cost_bps: 1.0
  target_volatility: 0.08
  max_leverage: 1.25

pairs:
  - name: wti_brent
    y: DCOILBRENTEU
    x: DCOILWTICO
    asset_classes: [commodity]
    thesis: Brent and WTI are linked by global crude balances while geography, quality, and transport constraints create temporary basis moves.

  - name: treasury_2y_1y
    y: DGS1
    x: DGS2
    asset_classes: [rates]
    thesis: One-year and two-year Treasury yields share the expected policy-rate path while front-end curve repricing can differ temporarily.

  - name: sp500_dow
    y: DJIA
    x: SP500
    asset_classes: [equity]
    thesis: Large-cap US equity indices share macro and earnings drivers but differ in weighting rules and sector composition.

  - name: nasdaq_sp500
    y: SP500
    x: NASDAQCOM
    asset_classes: [equity]
    thesis: Growth-heavy and broad US equity indices share a discount-rate channel but can undergo persistent structural repricing.

  - name: euro_sterling
    y: DEXUSUK
    x: DEXUSEU
    asset_classes: [fx]
    thesis: GBPUSD and EURUSD share the global dollar factor while UK and euro-area rate expectations drive the cross-basis.

  - name: hy_ig_credit
    y: BAMLC0A0CM
    x: BAMLH0A0HYM2
    asset_classes: [credit]
    thesis: Investment-grade and high-yield option-adjusted spreads share the corporate risk cycle with different default convexity.

  - name: vix_curve
    y: VXVCLS
    x: VIXCLS
    asset_classes: [volatility]
    thesis: Three-month and one-month equity implied volatility share the same option market while term structure reflects event and carry risk.

  - name: bitcoin_ether
    y: CBETHUSD
    x: CBBTCUSD
    asset_classes: [crypto]
    thesis: Bitcoin and ether share crypto liquidity and risk appetite while protocol-specific shocks can destabilize their hedge ratio.
